name: macOS release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Build Apple Silicon DMG
        run: ./macos/build-release.sh
      - name: Keep a downloadable workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: Live-Transcription-macOS
          path: dist/*.dmg
      - name: Add DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.dmg --generate-notes --title "$GITHUB_REF_NAME"
          fi
