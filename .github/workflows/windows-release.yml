name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release whose Windows installer is replaced, e.g. v1.22 (empty: workflow artifact only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build x64 installer
        shell: powershell
        run: ./windows/build-release.ps1
      - name: Keep a downloadable workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: Live-Transcription-Windows-x64
          path: dist/*-Setup.exe
      - name: Add installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*-Setup.exe --clobber
          elif [ -n "${{ inputs.release_tag }}" ]; then
            echo "Release $RELEASE_TAG does not exist" >&2
            exit 1
          else
            gh release create "$RELEASE_TAG" dist/*-Setup.exe --generate-notes --title "$RELEASE_TAG"
          fi
